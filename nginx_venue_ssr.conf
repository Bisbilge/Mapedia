# Mapedia — Nginx venue SSR routing
# Bu dosyayı sunucudaki mevcut nginx server bloğuna ekle.
#
# Mevcut yapı varsayımı:
#   - Django/Gunicorn: unix:/run/librespot.sock (veya 127.0.0.1:8000)
#   - React static:    /home/librespot/frontend/dist/
#
# Aşağıdaki iki location bloğunu server {} içine ekle:

# 1) /venue/ → Django SSR
location /venue/ {
    proxy_pass         http://unix:/run/librespot.sock;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# 2) /api/, /admin/, /sitemap → Django (zaten varsa bu blok atlanabilir)
location ~ ^/(api|admin|sitemap) {
    proxy_pass         http://unix:/run/librespot.sock;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# 3) Geri kalan her şey → React static
location / {
    root  /home/librespot/frontend/dist;
    try_files $uri $uri/ /index.html;
}

